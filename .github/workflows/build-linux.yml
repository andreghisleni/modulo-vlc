name: Gerar Release (Windows e Linux)

on:
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================
  # JOB 1: COMPILAÇÃO PARA LINUX (.AppImage)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Sistema (Tkinter)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Instalar Dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install requests pyinstaller

    - name: Injetar Variáveis de Produção (Substitui localhost)
      run: |
        sed -i 's|http://localhost:3004|${{ secrets.PROD_API_URL }}|g' main.py
        sed -i 's|sua_chave_aqui|${{ secrets.PROD_API_KEY }}|g' main.py

    - name: Compilar Binário Base (PyInstaller)
      run: |
        pyinstaller --noconsole --onefile --name "Monitor_Votacao" main.py
        chmod +x dist/Monitor_Votacao

    - name: Empacotar como AppImage
      run: |
        mkdir -p AppDir/usr/bin
        cp dist/Monitor_Votacao AppDir/usr/bin/
        
        echo '#!/bin/sh' > AppDir/AppRun
        echo 'cd "$(dirname "$0")"' >> AppDir/AppRun
        echo 'exec ./usr/bin/Monitor_Votacao' >> AppDir/AppRun
        chmod +x AppDir/AppRun
        
        echo '[Desktop Entry]' > AppDir/Monitor_Votacao.desktop
        echo 'Name=Monitor de Votacao' >> AppDir/Monitor_Votacao.desktop
        echo 'Exec=Monitor_Votacao' >> AppDir/Monitor_Votacao.desktop
        echo 'Icon=monitor' >> AppDir/Monitor_Votacao.desktop
        echo 'Type=Application' >> AppDir/Monitor_Votacao.desktop
        echo 'Categories=Utility;' >> AppDir/Monitor_Votacao.desktop
        
        # Correção do Erro 8: Gera um PNG transparente 1x1 real e válido
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > AppDir/monitor.png
        
        wget -q -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage"
        chmod +x appimagetool
        
        ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Monitor_Votacao-x86_64.AppImage

    - name: Publicar AppImage na Release
      uses: softprops/action-gh-release@v2
      with:
        files: Monitor_Votacao-x86_64.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 2: COMPILAÇÃO PARA WINDOWS (.exe)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write 

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install requests pyinstaller

    - name: Injetar Variáveis de Produção (Substitui localhost)
      run: |
        # No Windows usamos o PowerShell para fazer a substituição do texto
        (Get-Content main.py) -replace 'http://localhost:3004', '${{ secrets.PROD_API_URL }}' | Set-Content main.py
        (Get-Content main.py) -replace 'sua_chave_aqui', '${{ secrets.PROD_API_KEY }}' | Set-Content main.py

    - name: Compilar App (.exe)
      run: |
        pyinstaller --noconsole --onefile --name "Monitor_Votacao_Win" main.py

    - name: Publicar EXE na Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/Monitor_Votacao_Win.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}