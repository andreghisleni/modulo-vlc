name: Gerar Release (Windows e Linux)

on:
  push:
    tags:
      - 'v*'

jobs:
 # ==========================================
  # JOB 1: COMPILAÇÃO PARA LINUX (.AppImage)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Sistema (Tkinter e ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk imagemagick

    - name: Instalar Dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install requests pyinstaller

    - name: Injetar Variáveis de Produção (Substitui localhost)
      run: |
        sed -i 's|http://localhost:3004|${{ secrets.PROD_API_URL }}|g' main.py
        sed -i 's|sua_chave_aqui|${{ secrets.PROD_API_KEY }}|g' main.py

    - name: Compilar Binário Base (PyInstaller)
      run: |
        pyinstaller --noconsole --onefile --name "Monitor_Votacao" main.py
        chmod +x dist/Monitor_Votacao

    - name: Empacotar como AppImage
      run: |
        mkdir -p AppDir/usr/bin
        cp dist/Monitor_Votacao AppDir/usr/bin/
        
        # 1. Cria o AppRun mais robusto (Padrão oficial)
        cat << 'EOF' > AppDir/AppRun
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "${0}")")"
        exec "${HERE}/usr/bin/Monitor_Votacao" "$@"
        EOF
        chmod +x AppDir/AppRun
        
        # 2. Cria o arquivo .desktop rigorosamente padronizado
        cat << 'EOF' > AppDir/Monitor_Votacao.desktop
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=Monitor de Votacao
        Exec=Monitor_Votacao
        Icon=Monitor_Votacao
        Categories=Utility;
        EOF
        
        # 3. Usa o ImageMagick (nativo no Ubuntu) para criar um PNG 256x256 válido
        convert -size 256x256 xc:transparent AppDir/Monitor_Votacao.png
        
        # 4. Baixa a versão contínua (mais estável) do appimagetool
        wget -q -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
        chmod +x appimagetool
        
        # 5. Compila o AppImage
        ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Monitor_Votacao-x86_64.AppImage

    - name: Publicar AppImage na Release
      uses: softprops/action-gh-release@v2
      with:
        files: Monitor_Votacao-x86_64.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 2: COMPILAÇÃO PARA WINDOWS (.exe)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write 

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install requests pyinstaller

    - name: Injetar Variáveis de Produção (Substitui localhost)
      run: |
        # No Windows usamos o PowerShell para fazer a substituição do texto
        (Get-Content main.py) -replace 'http://localhost:3004', '${{ secrets.PROD_API_URL }}' | Set-Content main.py
        (Get-Content main.py) -replace 'sua_chave_aqui', '${{ secrets.PROD_API_KEY }}' | Set-Content main.py

    - name: Compilar App (.exe)
      run: |
        pyinstaller --noconsole --onefile --name "Monitor_Votacao_Win" main.py

    - name: Publicar EXE na Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/Monitor_Votacao_Win.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}